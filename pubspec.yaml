name: videe
description: "Videe - A clean, ad-free video downloader and media library."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3

  # State management
  provider: ^6.1.2

  # Browser
  webview_flutter: ^4.10.0

  # Video extraction (YouTube - pure Dart)
  youtube_explode_dart: ^2.3.5

  # Networking
  http: ^1.3.0
  dio: ^5.7.0

  # Video player
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Permissions
  permission_handler: ^11.3.1

  # File management
  open_file: ^3.5.10
  share_plus: ^10.1.4
  mime: ^2.0.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
